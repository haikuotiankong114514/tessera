[workspace]
resolver = "3"
members = ["crates/tessera-core", "crates/tessera-cli", "app/src-tauri", "macos/Bridge"]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/4zuma/tessera"

[workspace.dependencies]
tessera-core = { path = "crates/tessera-core" }
rayon = "1.12"
windows = "0.62"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Fast-to-build profile for local iteration on the scanner.
[profile.bench-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
