name: Tessera for Mac
on:
  push:
    branches: [macos]
  pull_request:
    branches: [macos]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tessera-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p tessera-core -p tessera-cli -p tessera-macos --all-targets -- -D warnings
      - run: macos/build.sh --universal
      - run: macos/test.sh
      - run: macos/test-renderer.sh
      - run: |
          slices=" $(lipo -archs 'macos/build/Tessera for Mac.app/Contents/MacOS/Tessera') "
          [[ $slices == *" arm64 "* && $slices == *" x86_64 "* ]]
      - run: macos/package.sh macos/build/Tessera-macOS-developer.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: Tessera-macOS-developer
          path: macos/build/Tessera-macOS-developer.dmg
