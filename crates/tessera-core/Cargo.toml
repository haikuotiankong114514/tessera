[package]
name = "tessera-core"
description = "Scanner, compact file tree, live updates, deletion and treemap layout for Tessera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rayon.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
]

# The `windows` crate's own core crate (same release): its `#[implement]`
# macro, used for IFileOperationProgressSink, expands to `::windows_core` paths.
[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62"

[dev-dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
